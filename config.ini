; Tous les paramètres modifiables de l'application sont regroupés ici.
; Pour changer de modèle, modifiez uniquement model_repo_id.
[microchat]
model_repo_id = Qwen/Qwen3-1.7B-GGUF
model_path =
models_dir = ~/.cache/microchat/models

; Matériel : n_threads = 0 utilise le nombre de cœurs physiques détecté.
n_threads = 0
n_ctx = 4096
n_batch = 512
use_mmap = true
use_mlock = false
flash_attn = false
warm_up = true

; Génération
max_tokens = 1024
temperature = 0.7
top_p = 0.8
top_k = 20
repeat_penalty = 1.05
system_prompt = Tu es un assistant conversationnel utile, précis et concis. Réponds dans la langue de l'utilisateur. Si tu ne sais pas, dis-le franchement plutôt que d'inventer. /no_think

; Mémoire de conversation
prompt_reserve_tokens = 512
history_low_watermark = 0.6

; Agent météo : conditions actuelles et prévisions jusqu'à 16 jours, ville obligatoire.
agent_instructions = UTILISE IMPÉRATIVEMENT L'OUTIL 'get_weather' dès qu'une ville est mentionnée pour la météo. Si l'utilisateur n'a cité aucune ville, demande-lui laquelle au lieu d'en choisir une. N'écris JAMAIS de texte expliquant que tu vas appeler l'outil : déclenche l'appel d'outil directement. Pour une date, recopie dans 'when' l'expression de l'utilisateur telle quelle (demain, samedi, le 21…) sans la convertir. Pour plusieurs jours (« sur 3 jours », « cette semaine »), indique le nombre de jours dans 'days'. Le résultat de l'outil est affiché tel quel à l'utilisateur.
weather_timeout_seconds = 30

; Interface terminal
session_id = terminal
render_refresh_hz = 12
render_interval_seconds = 0.08
verbose = false