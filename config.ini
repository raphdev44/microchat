; Tous les paramètres modifiables de l'application sont regroupés ici.
; Pour changer de modèle, modifiez uniquement model_repo_id.
[microchat]
model_repo_id = Qwen/Qwen3-1.7B-GGUF
model_path =
models_dir = ~/.cache/microchat/models

; Matériel : n_threads = 0 utilise le nombre de cœurs physiques détecté.
n_threads = 0
n_ctx = 4096
n_batch = 512
use_mmap = true
use_mlock = false
flash_attn = false
warm_up = true

; Génération
max_tokens = 1024
temperature = 0.7
top_p = 0.8
top_k = 20
repeat_penalty = 1.05
system_prompt = Tu es un assistant conversationnel utile, précis et concis. Réponds dans la langue de l'utilisateur. Si tu ne sais pas, dis-le franchement plutôt que d'inventer. /no_think

; Mémoire de conversation
prompt_reserve_tokens = 512
history_low_watermark = 0.6

; Agent météo : données actuelles seulement, ville obligatoire.
agent_instructions = UTILISE IMPÉRATIVEMENT L'OUTIL 'get_weather' dès qu'une ville est mentionnée ou demandée pour la météo. N'écris JAMAIS de texte expliquant que tu vas appeler l'outil : déclenche l'appel d'outil directement. L'outil fournit la météo actuelle (pas de prévisions futures ni d'historique).
weather_timeout_seconds = 10

; Interface terminal
session_id = terminal
render_refresh_hz = 12
render_interval_seconds = 0.08
verbose = false