; Tous les paramètres modifiables de l'application sont regroupés ici.
; Pour changer de modèle, modifiez uniquement model_repo_id.
[microchat]
model_repo_id = Qwen/Qwen3-1.7B-GGUF
# model_repo_id = LiquidAI/LFM2.5-8B-A1B-GGUF
model_path =
models_dir = ~/.cache/microchat/models

; Matériel : n_threads = 0 utilise le nombre de cœurs physiques détecté.
n_threads = 0
n_ctx = 4096
n_batch = 512
use_mmap = true
use_mlock = false
flash_attn = false
warm_up = true
enable_thinking = false

; Génération
max_tokens = 512
temperature = 0.1
top_p = 0.8
top_k = 20
repeat_penalty = 1.10
system_prompt = Tu es un assistant précis et concis. Réponds uniquement en français. Si tu ne sais pas, dis-le franchement plutôt que d'inventer.

; Mémoire de conversation
prompt_reserve_tokens = 512
history_low_watermark = 0.6

; Plugins installés à activer. Laisser vide pour le chatbot de base.
plugins = weather, web_search, rag
; Pour activer la recherche web : plugins = weather, web_search
; Pour activer l'index documentaire local : plugins = weather, web_search, rag

; Interface terminal
session_id = terminal
render_refresh_hz = 12
render_interval_seconds = 0.08
verbose = false

[plugin:weather]
timeout_seconds = 30

[plugin:web_search]
region = wt-wt
timeout_seconds = 5
max_results = 3

[plugin:rag]
index_path = ~/.cache/microchat/rag/index.json
max_results = 8
max_injected_results = 2
chunk_size = 500
min_similarity = 0.65
embedding_model = sentence-transformers/paraphrase-multilingual-mpnet-base-v2